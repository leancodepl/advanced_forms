# AI-Provenance:
#   model: Claude Fable 5.1
#   harness: Claude Code
name: advanced_forms_landing
description: The advanced_forms homepage, a statically generated Jaspr site served at / by the docs app.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  # Until the package is released; see leancodepl/flutter_corelibrary.
  jaspr_class_scope:
    git:
      url: https://github.com/leancodepl/flutter_corelibrary
      path: packages/jaspr_class_scope
      ref: claude/jaspra-scoped-classnames-kzspx3
  syntax_highlight_lite: ^0.0.1

dev_dependencies:
  # jaspr_builder 0.23 compiles only against analyzer 12, so every build-time
  # package that depends on analyzer is capped at its last analyzer-12 release
  # and pubspec.lock is committed. Lift this with the next jaspr release.
  build_runner: '>=2.10.0 <2.15.2'
  build_web_compilers: '>=4.8.5 <4.8.6'
  dart_style: '>=3.1.8 <3.1.9'
  jaspr_builder: ^0.23.4
  jaspr_class_scope_builder:
    git:
      url: https://github.com/leancodepl/flutter_corelibrary
      path: packages/jaspr_class_scope_builder
      ref: claude/jaspra-scoped-classnames-kzspx3
  leancode_lint: ^27.0.0

dependency_overrides:
  # leancode_lint wants analyzer 13+, but only its analysis_options.yaml is
  # consumed here; the plugin is resolved separately by the analysis server.
  analyzer: ^12.1.0

jaspr:
  mode: static
