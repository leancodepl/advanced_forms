# AI-Provenance:
#   model: Claude Fable 5.1
#   harness: Claude Code
name: advanced_forms_landing
description: The advanced_forms homepage, a statically generated Jaspr site served at / by the docs app.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  syntax_highlight_lite: ^0.0.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  leancode_lint: ^28.0.0

# A commit of jaspr's `next` branch, whose builder supports analyzer 13 and
# newer, which leancode_lint needs. Keep the commit the same as for `jaspr_cli`
# in .github/workflows/docs.yml and for `jaspr_lints` in analysis_options.yaml,
# and go back to the version constraints above once it is published.
dependency_overrides:
  jaspr:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
  jaspr_builder:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_builder
      ref: 9311973c7261b4a37ee2cb526466aa6934854851

jaspr:
  mode: static
