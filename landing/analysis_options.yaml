include: package:leancode_lint/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - lib/main.server.options.dart

plugins:
  leancode_lint:
    version: ^28.0.0
    diagnostics:
      cognitive_complexity: true
      prefer_dot_shorthand: true
  # The commit of the jaspr overrides in pubspec.yaml.
  jaspr_lints:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_lints
      ref: 9311973c7261b4a37ee2cb526466aa6934854851
    diagnostics:
      prefer_html_components: true
      prefer_styles_getter: true
      sort_children_last: true
      styles_ordering: true
      unsafe_imports: true
