name: test

on:
  push:
    branches: [ main ]
    tags-ignore: ['v*']
  pull_request:

jobs:
  test:
    name: Test and analyze

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # leancode_lint, a dev dependency, needs Dart 3.13. Keep in sync with
      # .fvmrc.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Download pub dependencies
        run: flutter pub get

      # Not `flutter analyze`: it leaves out the diagnostics of analyzer
      # plugins, which is where leancode_lint's own rules come from.
      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Run tests
        run: flutter test

      - name: Run the example app's tests
        run: flutter test
        working-directory: example

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

  floor:
    name: Test on Flutter 3.19 (lower bound)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The lowest Flutter that pubspec.yaml allows.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      # Consumers never resolve dev dependencies, so the package itself still
      # resolves on this SDK; leancode_lint, which needs Dart 3.13, does not.
      - name: Drop leancode_lint
        run: sed -i '/^  leancode_lint:/d' pubspec.yaml

      # The example app is not part of what consumers get and still depends on
      # leancode_lint, so it is left out: `dart pub get --no-example` skips it,
      # where `flutter pub get --no-example` and the implicit `pub get` of
      # `flutter test` would still touch it.
      - name: Download pub dependencies
        run: dart pub get --no-example

      - name: Run tests
        run: flutter test --no-pub

  pana-score:
    name: pana score

    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pana copies the whole repository and runs `dart format` over all of it,
      # and the formatter takes a file's language version from the nearest
      # .dart_tool/package_config.json. In a fresh checkout only the root
      # package has one, so the nested Dart packages (landing, docs_app/flutter,
      # example) get the root's 3.3: the landing does not parse and the others
      # format differently, and the score drops. Each nested package gets a
      # config stating its own SDK floor — what `pub get` would write, without
      # the Flutter SDK two of them need.
      - name: Give the nested packages their language versions
        run: |
          for dir in landing docs_app/flutter example; do
            name=$(awk -F': *' '/^name:/{print $2; exit}' "$dir/pubspec.yaml")
            floor=$(grep -E '^\s*sdk:' "$dir/pubspec.yaml" | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
            mkdir -p "$dir/.dart_tool"
            printf '{"configVersion":2,"packages":[{"name":"%s","rootUri":"../","packageUri":"lib/","languageVersion":"%s"}]}\n' \
              "$name" "$floor" > "$dir/.dart_tool/package_config.json"
            echo "$dir: $name @ $floor"
          done

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: .
