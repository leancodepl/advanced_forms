include: package:leancode_lint/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # The field widgets are generic over the controller's value type and take
    # callbacks over it, the same as the controllers in the package.
    unsafe_variance: ignore

# The same plugin setup as the package's analysis_options.yaml.
plugins:
  leancode_lint:
    version: ^28.0.0
    diagnostics:
      cognitive_complexity: true
      prefer_dot_shorthand: false
