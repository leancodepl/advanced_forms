include: package:leancode_lint/analysis_options_package.yaml

analyzer:
  exclude:
    # The docs site carries its own Flutter package (docs_app/flutter) with its
    # own options; analyzing it from here would hold the docs snippets to the
    # published-package rules and would fail on its generated sources.
    - docs_app/**
    # The landing page (landing/) is a separate Dart package on Jaspr, with its
    # own dependencies and options; from here its imports do not resolve.
    - landing/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # The controllers hold callbacks over their value type (validators, value
    # setters, builders), so they are invariant in it by design. Satisfying
    # the rule would mean changing the public API.
    unsafe_variance: ignore

# leancode_lint's own rules run as an analyzer plugin, so they need the Dart 3.13
# SDK that leancode_lint requires. That SDK is only needed to develop the package:
# consumers never resolve dev dependencies, and the `floor` job in
# .github/workflows/test.yml checks that the package still works on the lower
# bound in pubspec.yaml.
plugins:
  leancode_lint:
    version: ^28.0.0
    diagnostics:
      cognitive_complexity: true
      # Off: dot shorthands need Dart 3.10, and the package supports Dart 3.3.
      # The rule does not check the language version.
      prefer_dot_shorthand: false
